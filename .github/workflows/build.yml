# =============================================================================
# GitHub Actions build for InjectMyau
#
# 触发: push 到 master, 或手动在 Actions 页面点 "Run workflow"
# 产物: Actions 页面的 Artifacts 里下载
#   - Myau-Client.jar      (Java 客户端, Forge 1.8.9)
#   - myau_loader.exe      (Windows 注入器, 双击运行)
#   - myau_native.dll      (被注入到游戏进程的 native)
# =============================================================================
name: Build InjectMyau

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Java client (Forge 1.8.9)
        working-directory: OpenMyau-Inject
        shell: pwsh
        run: ./gradlew.bat --no-daemon build

      - name: Set up MSVC (VS 2022)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure loader (CMake / Ninja)
        working-directory: myau-natives
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
                -DJAVA_INCLUDE="$env:JAVA_HOME/include"

      - name: Build loader (Release)
        working-directory: myau-natives
        shell: pwsh
        run: cmake --build build --config Release

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p artifact
          ls OpenMyau-Inject/build/libs/*.jar | grep -vE 'sources|javadoc|dev' | head -1 | xargs -I{} cp {} artifact/Myau-Client.jar
          # Ninja 单配置器: exe/dll 直接在 build/ 根目录, 也兼容 Release/ 子目录
          find myau-natives/build -name 'myau_loader.exe' -exec cp {} artifact/ \;
          find myau-natives/build -name 'myau_native.dll' -exec cp {} artifact/ \;
          ls -la artifact/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InjectMyau-build
          path: artifact/
          retention-days: 30
