# =============================================================================
# GitHub Actions build for InjectMyau
#
# 触发: push 到 master, 或手动在 Actions 页面点 "Run workflow"
# 产物: Actions 页面的 Artifacts 里下载
#   - Myau-Client.jar      (Java 客户端, Forge 1.8.9)
#   - myau_loader.exe      (Windows 注入器, 双击运行)
#   - myau_native.dll      (被注入到游戏进程的 native)
#
# 为什么用 windows-latest: myau-natives 是 Win32/GDI+/DLL 注入, 必须在
# Windows + MSVC 上构建; 客户端在同一 job 里先 build, cmake 自动找 jar.
# =============================================================================
name: Build InjectMyau

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # README 明确要求 17: 16+ 才能跑 pack200, 21+ 会破坏工具链

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Java client (Forge 1.8.9)
        working-directory: OpenMyau-Inject
        run: ./gradlew.bat --no-daemon build

      - name: Configure loader (CMake / MSVC)
        working-directory: myau-natives
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJAVA_INCLUDE="$env:JAVA_HOME/include"

      - name: Build loader (Release)
        working-directory: myau-natives
        run: cmake --build build --config Release

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p artifact
          # 客户端 jar (排除 sources/dev jar)
          ls OpenMyau-Inject/build/libs/*.jar | grep -vE 'sources|javadoc|dev' | head -1 | xargs -I{} cp {} artifact/Myau-Client.jar
          # loader 与 native dll
          cp myau-natives/build/Release/myau_loader.exe artifact/ || true
          cp myau-natives/build/Release/myau_native.dll artifact/ || true
          ls -la artifact/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InjectMyau-build
          path: artifact/
          retention-days: 30
